
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmkarPortfolio // v2.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'acid': '#ccff00',
              'surface': '#121212',
              'bg': '#050505',
              'border': '#333333',
              'text-sec': '#888888'
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Space Mono', 'monospace'],
            },
            animation: {
              'scroll': 'scroll 20s linear infinite',
              'blink': 'blink 2s infinite',
              'spin-slow': 'spin 8s linear infinite',
            },
            keyframes: {
              scroll: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              blink: {
                '50%': { opacity: '0.5' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Extreme reset to kill the hand cursor entirely */
      * {
        cursor: none !important;
      }
      
      body {
        background-color: #050505;
        color: #ffffff;
        overflow-x: hidden;
      }

      .brutalist-border {
        border: 1px solid #333333;
      }
      .brutalist-border-hover:hover {
        border-color: #ccff00;
      }
      .marquee-tilted {
        transform: rotate(-2deg) scale(1.05);
      }
      
      /* Blend mode for the cursor - makes it feel premium */
      .cursor-blend {
        mix-blend-mode: difference;
      }

      /* Hide custom cursor on mobile */
      @media (max-width: 768px) {
        * {
          cursor: auto !important;
        }
        .marquee-tilted {
          transform: rotate(0) scale(1);
        }
      }

      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ccff00;
      }

      /* Ensure smooth scroll padding for sticky elements if added later */
      html {
        scroll-padding-top: 2rem;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
